<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ragebot dark control interface showcase</title>
  <desc id="desc">Dark Roblox menu with sidebar navigation, globals and aimbot control panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0d0f13"/><stop offset="1" stop-color="#1c2028"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3ca0ff"/><stop offset="1" stop-color="#745dff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
